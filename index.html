  ziad:     [ {mid:'qf_01',g1:3,g2:2,w:'France'},{mid:'qf_02',g1:1,g2:2,w:'Belgium'},{mid:'qf_03',g1:2,g2:1,w:'Norway'},{mid:'qf_04',g1:2,g2:0,w:'Argentina'} ],
  joe:      [ {mid:'qf_01',g1:2,g2:2,w:'Morocco'},{mid:'qf_02',g1:3,g2:1,w:'Spain'},{mid:'qf_03',g1:2,g2:1,w:'Norway'},{mid:'qf_04',g1:2,g2:0,w:'Argentina'} ],
};

let actuals = {};
let selectedPid = 'joe';
let lbScope = 'all';

const actualsRef = ref(db, 'csed_actuals');
onValue(actualsRef, snap => {
  actuals = snap.val() || {};
  renderAll();
});

function calcPoints(pid, scope) {
  let goals = 0, winner = 0;
  let preds = [];
  if (scope === 'r16') {
    preds = PREDICTIONS_R16[pid] || [];
  } else {
    preds = [...(PREDICTIONS[pid] || []), ...(PREDICTIONS_R16[pid] || []), ...(PREDICTIONS_QF[pid] || [])];
  }
  for (const pred of preds) {
    const act = actuals[pred.mid];
    if (!act || act.g1 === undefined) continue;
    const isQF = pred.mid.startsWith('qf_');
    const goalsPts  = isQF ? 3   : 2;
    const winnerPts = isQF ? 1.5 : 1;
    if (act.g1 === pred.g1 && act.g2 === pred.g2) goals += goalsPts;
    if (act.winner && act.winner === pred.w) winner += winnerPts;
  }
  return { goals, winner, total: goals + winner };
}

function matchPoints(pid, mid) {
  const isQF = mid.startsWith('qf_');
  const pred = (PREDICTIONS[pid] || []).find(p => p.mid === mid)
            || (PREDICTIONS_R16[pid] || []).find(p => p.mid === mid)
            || (PREDICTIONS_QF[pid] || []).find(p => p.mid === mid);
  const act = actuals[mid];
  if (!pred || !act || act.g1 === undefined) return null;
  const goalsPts  = isQF ? 3   : 2;
  const winnerPts = isQF ? 1.5 : 1;
  return {
    goals:  act.g1 === pred.g1 && act.g2 === pred.g2,
    winner: !!(act.winner && act.winner === pred.w),
    goalsPts, winnerPts
  };
}

function renderAll() {
  try { renderLeaderboard(); } catch(e) { document.getElementById(\'lb-container\').innerHTML = \'<div style="color:#ff6b6b;padding:16px;font-family:monospace;font-size:0.8rem">❌ \' + e.message + \'</div>\'; }
  try { renderMatches(); }     catch(e) { document.getElementById(\'matches-container\').innerHTML = \'<div style="color:#ff6b6b;padding:16px;font-family:monospace;font-size:0.8rem">❌ \' + e.message + \'</div>\'; }
  try { renderPredictions(); } catch(e) { document.getElementById(\'pred-container\').innerHTML = \'<div style="color:#ff6b6b;padding:16px;font-family:monospace;font-size:0.8rem">❌ \' + e.message + \'</div>\'; }
  try { renderAdmin(); }       catch(e) { document.getElementById(\'admin-container\').innerHTML = \'<div style="color:#ff6b6b;padding:16px;font-family:monospace;font-size:0.8rem">❌ \' + e.message + \'</div>\'; }
}

function renderLeaderboard() {
  const scored = PARTICIPANTS.map(p => ({ ...p, ...calcPoints(p.id, lbScope) }))
    .sort((a, b) => b.total - a.total || b.goals - a.goals);
  const maxPossible = lbScope === \'r16\' ? MATCHES_R16.length * 3 : (MATCHES.length + MATCHES_R16.length) * 3 + MATCHES_QF.length * 4.5;
  const rankEmoji = [\'🥇\',\'🥈\',\'🥉\'];
  const rankCls   = [\'r1\',\'r2\',\'r3\'];
  document.getElementById(\'lb-container\').innerHTML = scored.map((p, i) => {
    const rank = i < 3 ? rankEmoji[i] : `#${i+1}`;
    const rc   = i < 3 ? rankCls[i] : \'\';
    const pct  = maxPossible > 0 ? (p.total / maxPossible) * 100 : 0;
    return `<div class="lb-card ${i===0?\'rank-1\':\''}">
      <div class="lb-rank ${rc}">${rank}</div>
      <div class="lb-avatar" style="background:${p.color}22;border-color:${p.color};color:${p.color}">${p.initials}</div>
      <div class="lb-info">
        <div class="lb-name" style="color:${p.color}">${p.name}</div>
        <div class="lb-subname">${p.sub}</div>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%;background:${p.color}"></div></div>
        <div class="lb-breakdown">
          <span class="lb-badge">⚽ Goals <span>${p.goals}pts</span></span>
          <span class="lb-badge">🏆 Winner <span>${p.winner}pts</span></span>
        </div>
      </div>
      <div><div class="lb-pts" style="color:${p.color}">${p.total}</div><div class="lb-pts-label">pts</div></div>
    </div>`;
  }).join(\'\');
}

function sortedList(list) {
  const unsaved = list.filter(m => !actuals[m.id] || actuals[m.id].g1 === undefined);
  const saved   = list.filter(m =>  actuals[m.id] && actuals[m.id].g1 !== undefined);
  return [...unsaved, ...saved];
}

function matchCardHTML(m, roundLabel, roundCls) {
  const act = actuals[m.id];
  const has = act && act.g1 !== undefined;
  return \'<div class="match-card">\' +
    \'<div class="match-meta"><span class="match-round \' + roundCls + \'">\' + roundLabel + \'</span><span class="match-time">🕐 \' + m.time + \'</span></div>\' +
    \'<div class="match-teams">\' +
      \'<div class="team"><div class="team-flag">\' + m.t1 + \'</div><div class="team-name">\' + m.n1 + \'</div></div>\' +
      \'<div class="actual-score"><div class="score-box \' + (has?\'score-set\':\'\') + \'">\' + (has?act.g1:\'–\') + \'</div><div class="score-sep">vs</div><div class="score-box \' + (has?\'score-set\':\'\') + \'">\' + (has?act.g2:\'–\') + \'</div></div>\' +
      \'<div class="team"><div class="team-flag">\' + m.t2 + \'</div><div class="team-name">\' + m.n2 + \'</div></div>\' +
    \'</div>\' +
    (has ? \'<div class="winner-chip">🚀 Advances: \' + act.winner + \'</div>\' : \'<div class="winner-chip" style="opacity:0.35">⏳ Awaiting result</div>\') +
    \'</div>\';
}

function renderMatches() {
  const qfHtml  = sortedList(MATCHES_QF).map(m => matchCardHTML(m, \'1/4 · QF\', \'qf\')).join(\'\');
  const r16Html = sortedList(MATCHES_R16).map(m => matchCardHTML(m, \'1/16 · R16\', \'r16\')).join(\'\');
  const r32Html = sortedList(MATCHES).map(m => matchCardHTML(m, \'1/32 · R32\', \'\')).join(\'\');
  document.getElementById(\'matches-container\').innerHTML =
    \'<div class="matches-group"><div class="matches-subheader qf">🏆 Quarter Finals</div><div class="matches-grid">\' + qfHtml + \'</div></div>\' +
    \'<div class="matches-group"><div class="matches-subheader r16">⚔️ Round of 16</div><div class="matches-grid">\' + r16Html + \'</div></div>\' +
    \'<div class="matches-group"><div class="matches-subheader">📋 Round of 32</div><div class="matches-grid">\' + r32Html + \'</div></div>\';
}

function renderParticipantSelector() {
  document.getElementById(\'participant-selector\').innerHTML = PARTICIPANTS.map(p =>
    \'<button class="participant-btn \' + (p.id===selectedPid?\'active\':\'\') + \'" style="\' + (p.id===selectedPid ? \'border-color:\'+p.color+\';color:\'+p.color+\';background:\'+p.color+\'15\' : \'\') + \'" data-pid="\' + p.id + \'">\' + p.name + \'</button>\'
  ).join(\'\');
  document.querySelectorAll(\'.participant-btn\').forEach(btn =>
    btn.addEventListener(\'click\', () => { selectedPid = btn.dataset.pid; renderPredictions(); })
  );
}

function predCardHTML(pred, roundLabel) {
  const allMatches = [...MATCHES, ...MATCHES_R16, ...MATCHES_QF];
  const m   = allMatches.find(x => x.id === pred.mid);
  const p   = PARTICIPANTS.find(x => x.id === selectedPid);
  const pts = matchPoints(selectedPid, pred.mid);
  let badge = \'\';
  if (pts) {
    if (pts.goals && pts.winner) badge = \'<span class="pt-chip pt-both">+\' + (pts.goalsPts + pts.winnerPts) + \' ✅</span>\';
    else if (pts.goals)          badge = \'<span class="pt-chip pt-goals">+\' + pts.goalsPts + \' ⚽</span>\';
    else if (pts.winner)         badge = \'<span class="pt-chip pt-winner">+\' + pts.winnerPts + \' 🏆</span>\';
    else                         badge = \'<span class="pt-chip pt-none">0 ❌</span>\';
  }
  return \'<div class="pred-card">\' +
    \'<div class="pred-match-label">\' + roundLabel + \' · \' + m.time + \'</div>\' +
    \'<div class="pred-teams">\' +
      \'<div class="pred-team"><div class="pred-flag">\' + m.t1 + \'</div><div class="pred-name">\' + m.n1 + \'</div></div>\' +
      \'<div class="pred-score" style="color:\' + p.color + \'">\' + pred.g1 + \'</div>\' +
      \'<div class="pred-divider">–</div>\' +
      \'<div class="pred-score" style="color:\' + p.color + \'">\' + pred.g2 + \'</div>\' +
      \'<div class="pred-team"><div class="pred-flag">\' + m.t2 + \'</div><div class="pred-name">\' + m.n2 + \'</div></div>\' +
    \'</div>\' +
    \'<div class="pred-winner">🚀 \' + pred.w + \'</div>\' +
    \'<div class="pred-points">\' + badge + \'</div>\' +
    \'</div>\';
}

function renderPredictions() {
  renderParticipantSelector();
  const qfPreds  = sortedList(MATCHES_QF).map(m => (PREDICTIONS_QF[selectedPid]||[]).find(p=>p.mid===m.id)).filter(Boolean);
  const r16Preds = sortedList(MATCHES_R16).map(m => (PREDICTIONS_R16[selectedPid]||[]).find(p=>p.mid===m.id)).filter(Boolean);
  const r32Preds = sortedList(MATCHES).map(m => (PREDICTIONS[selectedPid]||[]).find(p=>p.mid===m.id)).filter(Boolean);
  const noQF  = \'<span style="color:var(--muted);font-size:0.8rem">No predictions submitted.</span>\';
  document.getElementById(\'pred-container\').innerHTML =
    \'<div class="matches-group"><div class="matches-subheader qf">🏆 Quarter Finals <small style="font-size:0.65rem;color:#ff9800;font-family:Inter">(goals=3pts, winner=1.5pts)</small></div><div class="pred-grid">\' + (qfPreds.map(p=>predCardHTML(p,\'QF\')).join(\'\')||noQF) + \'</div></div>\' +
    \'<div class="matches-group"><div class="matches-subheader r16">⚔️ Round of 16</div><div class="pred-grid">\' + (r16Preds.map(p=>predCardHTML(p,\'R16\')).join(\'\')||noQF) + \'</div></div>\' +
    \'<div class="matches-group"><div class="matches-subheader">📋 Round of 32</div><div class="pred-grid">\' + (r32Preds.map(p=>predCardHTML(p,\'R32\')).join(\'\')||noQF) + \'</div></div>\';
}

function adminCardHTML(m, roundLabel, roundCls) {
  const act = actuals[m.id] || {};
  return \'<div class="admin-match-card">\' +
    \'<div class="admin-match-header"><div class="admin-match-title"><span class="match-round \'+roundCls+\'">\'+roundLabel+\'</span> \'+m.t1+\' \'+m.n1+\' vs \'+m.n2+\' \'+m.t2+\'</div><span class="match-time">🕐 \'+m.time+\'</span></div>\' +
    \'<div class="admin-inputs">\' +
      \'<div class="admin-team-input"><div class="admin-team-flag">\'+m.t1+\'</div><input type="number" class="score-input" id="a_\'+m.id+\'_g1" min="0" max="20" value="\'+( act.g1!==undefined?act.g1:\'\')+\'" placeholder="–"/><div class="admin-team-label">\'+m.n1+\'</div></div>\' +
      \'<div class="admin-vs">vs</div>\' +
      \'<div class="admin-team-input"><div class="admin-team-flag">\'+m.t2+\'</div><input type="number" class="score-input" id="a_\'+m.id+\'_g2" min="0" max="20" value="\'+( act.g2!==undefined?act.g2:\'\')+\'" placeholder="–"/><div class="admin-team-label">\'+m.n2+\'</div></div>\' +
      \'<div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px">🚀 Advances</div>\' +
        \'<select class="winner-select" id="a_\'+m.id+\'_w"><option value="">-- Select --</option><option value="\'+m.n1+\'" \'+( act.winner===m.n1?\'selected\':\'\')+\'>\'+m.t1+\' \'+m.n1+\'</option><option value="\'+m.n2+\'" \'+( act.winner===m.n2?\'selected\':\'\')+\'>\'+m.t2+\' \'+m.n2+\'</option></select>\' +
      \'</div>\' +
      \'<div class="admin-actions"><button class="save-btn" id="btn_\'+m.id+\'" onclick="saveMatch(\\\'\'+ m.id +\'\\\')">Save</button>\' +
        (act.g1!==undefined ? \'<button class="reset-btn" id="rst_\'+m.id+\'" onclick="resetMatch(\\\'\'+ m.id +\'\\\')">↺ Reset</button><span class="saved-badge">✓ Saved</span>\' : \'\') +
      \'</div>\' +
    \'</div></div>\';
}

function renderAdmin() {
  const qfHtml  = sortedList(MATCHES_QF).map(m => adminCardHTML(m, \'1/4 · QF\', \'qf\')).join(\'\');
  const r16Html = sortedList(MATCHES_R16).map(m => adminCardHTML(m, \'1/16 · R16\', \'r16\')).join(\'\');
  const r32Html = sortedList(MATCHES).map(m => adminCardHTML(m, \'1/32 · R32\', \'\')).join(\'\');
  document.getElementById(\'admin-container\').innerHTML =
    \'<div class="matches-group"><div class="matches-subheader qf">🏆 Quarter Finals</div>\' + qfHtml + \'</div>\' +
    \'<div class="matches-group"><div class="matches-subheader r16">⚔️ Round of 16</div>\' + r16Html + \'</div>\' +
    \'<div class="matches-group"><div class="matches-subheader">📋 Round of 32</div>\' + r32Html + \'</div>\';
}

window.saveMatch = async function(mid) {
  const g1 = parseInt(document.getElementById(\'a_\'+mid+\'_g1\').value);
  const g2 = parseInt(document.getElementById(\'a_\'+mid+\'_g2\').value);
  const winner = document.getElementById(\'a_\'+mid+\'_w\').value;
  if (isNaN(g1) || isNaN(g2) || !winner) { alert(\'Please fill all fields.\'); return; }
  const btn = document.getElementById(\'btn_\'+mid);
  btn.disabled = true; btn.textContent = \'Saving…\';
  await set(ref(db, \'csed_actuals/\'+mid), { g1, g2, winner });
  btn.disabled = false; btn.textContent = \'Save\';
};

window.resetMatch = async function(mid) {
  const allMatches = [...MATCHES, ...MATCHES_R16, ...MATCHES_QF];
  const m = allMatches.find(x => x.id === mid);
  if (!confirm(\'Reset result for \' + m.n1 + \' vs \' + m.n2 + \'?\')) return;
  const btn = document.getElementById(\'rst_\'+mid);
  if (btn) { btn.disabled = true; btn.textContent = \'Resetting…\'; }
  const { remove } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  await remove(ref(db, \'csed_actuals/\'+mid));
};

document.querySelectorAll(\'.lb-toggle-btn\').forEach(btn =>
  btn.addEventListener(\'click\', () => {
    lbScope = btn.dataset.scope;
    document.querySelectorAll(\'.lb-toggle-btn\').forEach(b => b.classList.remove(\'active\'));
    btn.classList.add(\'active\');
    renderLeaderboard();
  })
);

document.querySelectorAll(\'.nav-tab\').forEach(tab =>
  tab.addEventListener(\'click\', () => {
    document.querySelectorAll(\'.nav-tab\').forEach(t => t.classList.remove(\'active\'));
    document.querySelectorAll(\'.page\').forEach(p => p.classList.remove(\'active\'));
    tab.classList.add(\'active\');
    document.getElementById(\'page-\'+tab.dataset.page).classList.add(\'active\');
  })
);

renderAll();
</script>
</body>
</html>
